name: 服务状态探测

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 探测各服务
        env:
          STATUS_API_BASE_URL: ${{ secrets.STATUS_API_BASE_URL }}
          STATUS_TARGET_API_URL: ${{ secrets.STATUS_TARGET_API_URL }}
        run: node scripts/check.mjs

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
